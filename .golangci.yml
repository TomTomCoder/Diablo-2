---
linters-settings:
  dupl:
    threshold: 100
  funlen:
    lines: 100
    statements: 50
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks: []
  gocyclo:
    min-complexity: 15
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/OpenDiablo2/OpenDiablo2
  govet:
    enable-all: true
    disable:
      # While struct sizes could be smaller if fields aligned properly, that also leads
      # to possibly non-intuitive layout of struct fields (harder to read). Disable
      # `fieldalignment` check here until we evaluate if it is worthwhile.
      - fieldalignment
      # https://github.com/golangci/golangci-lint/issues/1973
      - sigchanyzer
  lll:
    line-length: 140
  misspell:
    locale: US

linters:
  disable-all: true
  enable:
    # Correction (août 2026): deadcode/golint/gomnd/structcheck/varcheck
    # removed from this list -- golangci-lint's own log flagged all five
    # as "fully inactivated" (their repos are archived/they were merged
    # into other linters years ago), and referencing an inactivated
    # linter here is a hard failure (exit code 7) that --issues-exit-code
    # doesn't cover, separate from "issues found". unused already covers
    # what deadcode/structcheck/varcheck did.
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - rowserrcheck
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl

run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - .github
    - build
    - web
  exclude-rules:
    - linters:
        - funlen
      # Disable 'funlen' linter for test functions.
      # It's common for table-driven tests to be more than 60 characters long
      source: "^func Test"
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
