name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- Lint below needs real local git history to diff
      # against (see that step's own comment); a shallow checkout (the
      # default) wouldn't have origin/master available to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ebiten needs these to build on Linux (X11/OpenGL/ALSA), see build.sh
      #
      # Correction (août 2026): missing libxxf86vm-dev made every CI run this
      # session fail at the link step ("cannot find -lXxf86vm") -- caught by
      # checking `gh run list`, not by anything failing locally (this
      # environment has no display/X11 at all, so `go build` here never
      # exercises this cgo link step the same way). GLFW (ebiten's desktop
      # backend) needs this X11 XF86VidMode extension library alongside the
      # other X11 dev packages already listed here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libgl1-mesa-dev libasound2-dev xvfb

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Correction (août 2026): every test binary that imports ebiten
      # (even transitively -- most packages in this module do) panics on
      # a headless runner: ebiten/v2/internal/ui's own package init()
      # tries to connect GLFW to a real X11 display, and there is none
      # here ("glfw: X11: The DISPLAY environment variable is missing").
      # `go build`/`go vet` never execute that init() (they only compile/
      # type-check), so this only shows up for Test -- xvfb-run gives
      # GLFW a real (virtual, headless) X server to connect to instead.
      - name: Test
        run: xvfb-run -a go test ./...

      # .golangci.yml predates golangci-lint v2's config schema; pin v1 rather
      # than migrating the config (see docs/migration-guide when that's worth doing).
      #
      # ponytail: the config was apparently never actually wired into CI before
      # this workflow — running it surfaces hundreds of pre-existing style
      # violations (mostly `wsl` cuddle-statement rules) across the codebase.
      # Fixing those is a separate, large, unrelated cleanup; only-new-issues
      # keeps CI green today and enforces the config on new/changed code only.
      #
      # Correction (août 2026): only-new-issues: true makes the action fetch
      # this PR's diff via GitHub's REST API to know which lines are "new" --
      # this PR imports the whole OpenDiablo2 codebase as its base, so its
      # diff is far past GitHub's 300-file cap on that endpoint ("Sorry, the
      # diff exceeded the maximum number of files"), and the Lint step failed
      # outright rather than actually linting anything. Known, still-open
      # upstream limitation (golangci-lint-action#1015/#820) -- the
      # documented workaround is to skip the action's own API-based diffing
      # and pass golangci-lint's own --new-from-rev flag instead, which
      # diffs against a real local git ref (needs the full history from
      # fetch-depth: 0 above), no GitHub API involved, no file-count limit.
      #
      # Correction (août 2026, again): the pinned v1.64.2 *binary* release
      # is itself built with Go 1.24, and refuses to analyze code that
      # targets a newer Go version ("the Go language version (go1.24) used
      # to build golangci-lint is lower than the targeted Go version
      # (1.25.0)") -- go.mod's own `go 1.25.0` isn't an accidental bump,
      # wazero (added in Phase 3) genuinely requires it (confirmed via
      # `go list -m -json`, not assumed), so lowering go.mod isn't an
      # option. install-mode: goinstall compiles golangci-lint from source
      # using the Go toolchain already set up above (which resolves to
      # 1.25.0+ via GOTOOLCHAIN=auto, same as Build/Test do) instead of
      # downloading a prebuilt binary frozen at whatever Go version its own
      # release used.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.2
          install-mode: goinstall
          args: --new-from-rev=origin/master
